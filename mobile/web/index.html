<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d553d">
  <title>Briga+</title>
  <style>
    :root{color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 18%,#fff1c6 0,transparent 17rem),#faf6ee;color:#0b352a}
    main{display:grid;justify-items:center;text-align:center}
    .mark{display:grid;width:92px;height:92px;place-items:center;border-radius:27px;background:linear-gradient(145deg,#188059,#0d553d);color:#fff;font-size:2rem;font-weight:900;box-shadow:0 18px 38px rgba(13,85,61,.2)}
    h1{margin:18px 0 4px;font-size:2rem;letter-spacing:-.04em}
    h1 span{color:#e02a24}
    p{margin:0;color:#66766f;font-size:1rem}
    .loader{display:flex;gap:7px;margin-top:24px}
    .loader i{width:9px;height:9px;border-radius:50%;background:#188059;animation:pulse 1.2s ease-in-out infinite}
    .loader i:nth-child(2){animation-delay:.15s}.loader i:nth-child(3){animation-delay:.3s}
    @keyframes pulse{0%,70%,100%{opacity:.28;transform:translateY(0)}35%{opacity:1;transform:translateY(-5px)}}
    @media(prefers-reduced-motion:reduce){.loader i{animation:none;opacity:.65}}
  </style>
</head>
<body>
  <main aria-live="polite">
    <div class="mark" aria-hidden="true">B+</div>
    <h1>Briga<span>+</span></h1>
    <p>Pokrećemo vaš porodični prostor…</p>
    <div class="loader" aria-hidden="true"><i></i><i></i><i></i></div>
  </main>
</body>
</html>
