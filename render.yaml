services:
  - type: web
    name: briga-plus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate && python manage.py seed_demo && python manage.py bootstrap_owner
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /zdravlje/
    envVars:
      - key: BRIGA_DEBUG
        value: "0"
      - key: BRIGA_SECRET_KEY
        generateValue: true
      - key: BRIGA_ALLOWED_HOSTS
        value: briga-plus.onrender.com
      - key: BRIGA_CSRF_TRUSTED_ORIGINS
        value: https://briga-plus.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: briga-plus-db
          property: connectionString
      # Uneti u Render Dashboard-u; nikada ne čuvati ključeve u Git-u.
      - key: BRIGA_VAPID_PUBLIC_KEY
        sync: false
      - key: BRIGA_VAPID_PRIVATE_KEY
        sync: false
      - key: BRIGA_VAPID_SUBJECT
        value: mailto:podrska@briga-plus.rs
      - key: BRIGA_STORAGE_BUCKET
        sync: false
      - key: BRIGA_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: BRIGA_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: BRIGA_STORAGE_ENDPOINT_URL
        sync: false
      - key: BRIGA_STORAGE_REGION
        value: auto
  - type: cron
    name: briga-plus-obavestenja
    runtime: python
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py create_due_alerts
    envVars:
      - key: BRIGA_DEBUG
        value: "0"
      - key: BRIGA_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: briga-plus-db
          property: connectionString
      - key: BRIGA_VAPID_PUBLIC_KEY
        sync: false
      - key: BRIGA_VAPID_PRIVATE_KEY
        sync: false
      - key: BRIGA_VAPID_SUBJECT
        value: mailto:podrska@briga-plus.rs
databases:
  - name: briga-plus-db
    plan: free
    databaseName: briga_plus
    user: briga_plus
